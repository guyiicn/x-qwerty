<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #f5f5f5; font-family: sans-serif; }
    main { min-height: 100%; display: grid; place-items: center; padding: 24px; box-sizing: border-box; text-align: center; }
    button { background: #fff; color: #000; border: 0; border-radius: 999px; padding: 12px 20px; font-weight: 700; }
    p { color: #aaa; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <section>
      <h1>无法打开 X</h1>
      <p>网络或登录页面暂时没有响应。</p>
      <button onclick="AndroidShortcut.reload()">重新加载</button>
    </section>
  </main>
</body>
</html>
